name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bff/package-lock.json
            link-service/package-lock.json
            frontend/package-lock.json

      - name: Test and build frontend
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend

      - name: Lint and test Node services
        run: |
          for service in bff link-service; do
            npm ci --prefix "$service"
            npm run lint --prefix "$service"
            npm test --prefix "$service"
          done

      - uses: actions/setup-go@v6
        with:
          go-version-file: stats-service/go.mod
          cache-dependency-path: stats-service/go.sum

      - name: Lint and test stats-service
        working-directory: stats-service
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race -cover ./...

      - name: Build smoke-test images
        run: |
          image_namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/encurta"
          echo "IMAGE_NAMESPACE=$image_namespace" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=ci" >> "$GITHUB_ENV"
          for service in frontend bff link-service stats-service; do
            docker build -t "$image_namespace/$service:ci" "./$service"
          done

      - name: Smoke test production Compose
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up \
            --detach --wait --wait-timeout 360
          curl --fail --retry 30 --retry-delay 5 --retry-connrefused \
            http://127.0.0.1:3000/health
          curl --fail --retry 30 --retry-delay 5 --retry-connrefused \
            http://127.0.0.1:5173/health
          curl --fail --silent http://127.0.0.1:5173/ | grep -q '<div id="app">'

      - name: End-to-end smoke test
        run: BFF_URL=http://localhost:5173 bash scripts/smoke-e2e.sh

      - name: Stats PostgreSQL, Redis and Kafka integration tests
        run: |
          docker run --rm --network puc-asm-grupo3_default \
            -e TEST_DATABASE_URL=postgresql://stats_user:stats_pass@postgres:5432/stats \
            -e TEST_REDIS_URL=redis://redis:6379 \
            -e TEST_KAFKA_BROKERS=kafka:9092 \
            -v "$PWD/stats-service:/src" -w /src \
            -v "$(go env GOMODCACHE):/go/pkg/mod" \
            golang:1.26-alpine go test -v -run 'TestPostgres|TestRedis|TestKafka' ./...

      - name: Tear down smoke stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down --volumes --remove-orphans

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish images
        run: |
          image_namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/encurta"
          image_tag="sha-${GITHUB_SHA::7}"
          for service in frontend bff link-service stats-service; do
            docker buildx build --push \
              --tag "$image_namespace/$service:$image_tag" \
              --tag "$image_namespace/$service:latest" \
              "./$service"
          done
