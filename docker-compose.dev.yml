# Publica a infraestrutura e os serviços internos no host, só em 127.0.0.1,
# para rodar ou depurar um componente fora do Docker.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait
#
# Do host, o Kafka é acessado em localhost:29092.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  kafka:
    ports:
      - "127.0.0.1:29092:29092"

  link-service:
    ports:
      - "127.0.0.1:3010:3010"

  stats-service:
    ports:
      - "127.0.0.1:8000:8000"
